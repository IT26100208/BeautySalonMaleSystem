
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Bella Aura</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            min-height: 100vh;
            padding: 40px 20px;
            color: white;
            background:
                    linear-gradient(rgba(15, 10, 20, .65),
                    rgba(15, 10, 20, .65)),
                    url("/images/bg3.jpg") center/cover fixed;
        }

        .container {
            width: 100%;
            max-width: 760px;
            margin: auto;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .topbar a {
            color: white;
            text-decoration: none;
        }

        .card {
            padding: 35px;
            border-radius: 24px;
            background: rgba(255, 255, 255, .12);
            border: 1px solid rgba(255, 255, 255, .22);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, .25);
        }

        h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: rgba(255, 255, 255, .7);
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .message {
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 18px;
        }

        .success {
            background: rgba(40, 190, 110, .22);
        }

        .error {
            background: rgba(255, 70, 90, .22);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 13px;
            color: rgba(255, 255, 255, .85);
        }

        input {
            width: 100%;
            padding: 13px;
            color: white;
            background: rgba(255, 255, 255, .09);
            border: 1px solid rgba(255, 255, 255, .2);
            border-radius: 10px;
            outline: none;
        }

        input:focus {
            border-color: #ff69b4;
        }

        input[readonly] {
            opacity: .7;
        }

        .hint {
            font-size: 12px;
            color: rgba(255, 255, 255, .6);
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 20px;
            border: 0;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }

        .save {
            color: white;
            background: linear-gradient(135deg, #ff69b4, #9b5de5);
        }

        .back {
            color: white;
            background: rgba(255, 255, 255, .12);
            border: 1px solid rgba(255, 255, 255, .2);
        }

        .field-error {
            color: #ffd0dc;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            .card {
                padding: 24px 18px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="topbar">
        <a th:href="@{/customer}">← Customer Home</a>
        <strong>Bella Aura</strong>
    </div>

    <section class="card">

        <h1>My Profile</h1>

        <p class="subtitle">
            View and update your personal information.
        </p>

        <div th:if="${success}"
             class="message success"
             th:text="${success}">
        </div>

        <div th:if="${error}"
             class="message error"
             th:text="${error}">
        </div>

        <form th:action="@{/customer/profile}"
              th:object="${user}"
              method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <div class="form-grid">

                <div class="field">
                    <label for="firstName">First Name</label>
                    <input id="firstName"
                           type="text"
                           th:field="*{firstName}"
                           required>
                    <span class="field-error"
                          th:errors="*{firstName}"></span>
                </div>

                <div class="field">
                    <label for="lastName">Last Name</label>
                    <input id="lastName"
                           type="text"
                           th:field="*{lastName}"
                           required>
                    <span class="field-error"
                          th:errors="*{lastName}"></span>
                </div>

                <div class="field">
                    <label for="email">Email Address</label>
                    <input id="email"
                           type="email"
                           th:field="*{email}"
                           required>
                    <span class="field-error"
                          th:errors="*{email}"></span>
                </div>

                <div class="field">
                    <label for="phoneNumber">Phone Number</label>
                    <input id="phoneNumber"
                           type="text"
                           th:field="*{phoneNumber}"
                           required>
                    <span class="field-error"
                          th:errors="*{phoneNumber}"></span>
                </div>

                <div class="field full">
                    <label for="address">Address</label>
                    <input id="address"
                           type="text"
                           th:field="*{address}">
                </div>

                <div class="field full">
                    <label for="loyaltyNumber">Loyalty Number</label>
                    <input id="loyaltyNumber"
                           type="text"
                           th:value="${loyaltyNumber}"
                           readonly>
                </div>

                <div class="field full">
                    <label for="password">New Password (Optional)</label>
                    <input id="password"
                           type="password"
                           th:field="*{password}"
                           autocomplete="new-password"
                           placeholder="Leave blank to keep current password">
                    <span class="hint">
                        Your current password will remain unchanged
                        if this field is left blank.
                    </span>
                </div>

            </div>

            <div class="actions">
                <button class="btn save" type="submit">
                    Save Changes
                </button>

                <a class="btn back" th:href="@{/customer}">
                    Cancel
                </a>
            </div>

        </form>

    </section>
</div>

</body>
</html>
