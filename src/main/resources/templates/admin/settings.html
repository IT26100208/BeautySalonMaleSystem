<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Settings - Bella Aura</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Exact Glassmorphism styling matching dashboard.html */
        .glass-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .glass-input {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #ffffff;
        }

        .glass-input:focus {
            background: rgba(0, 0, 0, 0.4);
            border-color: #a855f7;
            outline: none;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.4);
        }

        /* Time input calendar/clock icon invert for dark theme */
        ::-webkit-calendar-picker-indicator {
            filter: invert(1);
        }
    </style>
</head>
<body class="bg-cover bg-center bg-fixed min-h-screen text-white font-sans flex p-6"
      style="background-image: linear-gradient(rgba(15, 15, 20, 0.85), rgba(15, 15, 20, 0.9)), url('/images/background.jpg');">

<!-- LEFT AREA: Main Dashboard Content -->
<div class="flex-1 mr-6 flex flex-col space-y-6">

    <!-- Top Navigation Bar -->
    <header class="flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold tracking-tight">System & Salon Settings 👋</h1>
            <p class="text-xs text-gray-400 mt-1">Configure opening hours, store information, and appointment constraints</p>
        </div>

        <a th:href="@{/logout}" class="glass-card px-4 py-2 rounded-xl text-xs font-medium text-gray-300 hover:text-white hover:bg-white/10 transition flex items-center gap-2">
            <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout
        </a>
    </header>

    <!-- Main Form Glass Container (Replaces the Users Table area) -->
    <main class="glass-card rounded-3xl p-8 flex-1">
        <form th:action="@{/admin/settings}" th:object="${settings}" method="post" class="space-y-6 max-w-3xl">
            <input type="hidden" th:field="*{id}" />

            <!-- Salon Name -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Salon Name</label>
                <input type="text" th:field="*{salonName}" class="glass-input w-full px-4 py-3 rounded-xl transition text-sm" placeholder="Gentlemen's Salon" required />
            </div>

            <!-- Opening & Closing Times -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Opening Time</label>
                    <input type="time" th:field="*{openingTime}" class="glass-input w-full px-4 py-3 rounded-xl transition text-sm" required />
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Closing Time</label>
                    <input type="time" th:field="*{closingTime}" class="glass-input w-full px-4 py-3 rounded-xl transition text-sm" required />
                </div>
            </div>

            <!-- Contact Details -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Contact Phone</label>
                    <input type="text" th:field="*{contactPhone}" class="glass-input w-full px-4 py-3 rounded-xl transition text-sm" placeholder="+94 11 234 5678" />
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Contact Email</label>
                    <input type="email" th:field="*{contactEmail}" class="glass-input w-full px-4 py-3 rounded-xl transition text-sm" placeholder="info@gentlemenssalon.lk" />
                </div>
            </div>

            <!-- Currency & Appointment Limits -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Currency Symbol</label>
                    <input type="text" th:field="*{currencySymbol}" class="glass-input w-full px-4 py-3 rounded-xl transition text-sm" placeholder="LKR" />
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Max Appointments Per Slot</label>
                    <input type="number" th:field="*{maxAppointmentsPerSlot}" class="glass-input w-full px-4 py-3 rounded-xl transition text-sm" min="1" placeholder="5" />
                </div>
            </div>

            <!-- Submit Button -->
            <div class="pt-4">
                <button type="submit" class="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-medium text-sm px-8 py-3 rounded-xl transition shadow-lg shadow-purple-600/30 flex items-center gap-2">
                    <i class="fa-solid fa-floppy-disk"></i> Save Settings
                </button>
            </div>
        </form>
    </main>
</div>

<!-- RIGHT AREA: Matching Dashboard Floating Sidebar Panel -->
<aside class="w-72 glass-card rounded-3xl p-6 flex flex-col justify-between h-[calc(100vh-3rem)] sticky top-6">
    <div>
        <!-- Brand Header -->
        <div class="flex items-center space-x-3 mb-8">
            <div class="w-10 h-10 rounded-xl bg-purple-600 flex items-center justify-center font-bold text-white shadow-md shadow-purple-600/40">
                <i class="fa-solid fa-scissors"></i>
            </div>
            <div>
                <h3 class="font-bold text-sm text-white">Bella Aura</h3>
                <p class="text-[10px] text-gray-400">Management System</p>
            </div>
        </div>

        <!-- Navigation Links -->
        <nav class="space-y-2">
            <p class="text-[10px] font-semibold tracking-wider text-gray-400 uppercase mb-2 px-3">Main Menu</p>

            <a th:href="@{/admin/dashboard}" class="flex items-center space-x-3 px-4 py-3 rounded-2xl text-xs font-medium text-gray-300 hover:bg-white/10 transition">
                <i class="fa-solid fa-chart-pie w-5"></i><span>Dashboard</span>
            </a>
            <a th:href="@{/admin/users}" class="flex items-center space-x-3 px-4 py-3 rounded-2xl text-xs font-medium text-gray-300 hover:bg-white/10 transition">
                <i class="fa-solid fa-users w-5"></i><span>Users</span>
            </a>
            <a th:href="@{/admin/staff}" class="flex items-center space-x-3 px-4 py-3 rounded-2xl text-xs font-medium text-gray-300 hover:bg-white/10 transition">
                <i class="fa-solid fa-user-tie w-5"></i><span>Staff</span>
            </a>
            <a th:href="@{/admin/appointments}" class="flex items-center space-x-3 px-4 py-3 rounded-2xl text-xs font-medium text-gray-300 hover:bg-white/10 transition">
                <i class="fa-solid fa-calendar-check w-5"></i><span>Appointments</span>
            </a>
            <a th:href="@{/admin/services}" class="flex items-center space-x-3 px-4 py-3 rounded-2xl text-xs font-medium text-gray-300 hover:bg-white/10 transition">
                <i class="fa-solid fa-scissors w-5"></i><span>Services</span>
            </a>

            <p class="text-[10px] font-semibold tracking-wider text-gray-400 uppercase pt-4 mb-2 px-3">Account</p>

            <!-- Highlighted Active Tab -->
            <a th:href="@{/admin/settings}" class="flex items-center space-x-3 px-4 py-3 rounded-2xl text-xs font-semibold bg-purple-600/70 text-white shadow-md shadow-purple-600/30 transition">
                <i class="fa-solid fa-gear w-5"></i><span>Settings</span>
            </a>
        </nav>
    </div>

    <!-- User Profile Card at Bottom of Sidebar -->
    <div class="glass-card p-3 rounded-2xl flex items-center space-x-3 border-white/10">
        <div class="w-8 h-8 rounded-xl bg-purple-500/80 flex items-center justify-center font-bold text-xs">
            A
        </div>
        <div class="overflow-hidden">
            <p class="text-xs font-bold text-white truncate">Administrator</p>
            <p class="text-[10px] text-gray-400 truncate">System Admin</p>
        </div>
    </div>
</aside>

</body>
</html>
