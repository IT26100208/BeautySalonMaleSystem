<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>System Settings - Gentlemen's Salon</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .dashboard-container { display: flex; min-height: 100vh; font-family: sans-serif; }
        .sidebar { width: 240px; background-color: #1a1a24; color: #fff; padding: 20px; }
        .sidebar h2 { margin-bottom: 30px; font-size: 20px; color: #e2b04a; }
        .sidebar ul { list-style: none; padding: 0; }
        .sidebar li { margin-bottom: 15px; }
        .sidebar a { color: #ccc; text-decoration: none; font-size: 16px; display: block; padding: 8px 12px; border-radius: 4px; }
        .sidebar a.active, .sidebar a:hover { background-color: #2c2c3d; color: #fff; }
        .main-content { flex: 1; padding: 30px; background-color: #f4f6f9; }
        .form-card { background: #fff; padding: 30px; border-radius: 8px; max-width: 600px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn-submit { background-color: #e2b04a; color: #1a1a24; padding: 12px 20px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn-submit:hover { background-color: #d19f39; }
        .alert-success { background-color: #d4edda; color: #155724; padding: 12px; border-radius: 4px; margin-bottom: 20px; }
    </style>
</head>
<body>
<div class="dashboard-container">
    <div class="sidebar">
        <h2>Salon Admin</h2>
        <ul>
            <li><a th:href="@{/admin/dashboard}">Dashboard</a></li>
            <li><a th:href="@{/admin/staff}">Staff Management</a></li>
            <li><a th:href="@{/admin/services}">Salon Services</a></li>
            <li><a th:href="@{/admin/users}">User Accounts</a></li>
            <li><a th:href="@{/admin/settings}" class="active">System Settings</a></li>
        </ul>
    </div>

    <div class="main-content">
        <h1>System & Salon Settings</h1>

        <div th:if="${successMessage}" class="alert-success" th:text="${successMessage}"></div>

        <div class="form-card">
            <form th:action="@{/admin/settings}" th:object="${settings}" method="post">
                <input type="hidden" th:field="*{id}"/>

                <div class="form-group">
                    <label for="salonName">Salon Name</label>
                    <input type="text" id="salonName" th:field="*{salonName}" required/>
                </div>

                <div class="form-group">
                    <label for="openingTime">Opening Time</label>
                    <input type="time" id="openingTime" th:field="*{openingTime}" required/>
                </div>

                <div class="form-group">
                    <label for="closingTime">Closing Time</label>
                    <input type="time" id="closingTime" th:field="*{closingTime}" required/>
                </div>

                <div class="form-group">
                    <label for="contactPhone">Contact Phone</label>
                    <input type="text" id="contactPhone" th:field="*{contactPhone}"/>
                </div>

                <div class="form-group">
                    <label for="contactEmail">Contact Email</label>
                    <input type="email" id="contactEmail" th:field="*{contactEmail}"/>
                </div>

                <div class="form-group">
                    <label for="currencySymbol">Currency Symbol</label>
                    <input type="text" id="currencySymbol" th:field="*{currencySymbol}"/>
                </div>

                <div class="form-group">
                    <label for="maxAppointmentsPerSlot">Max Appointments Per Slot</label>
                    <input type="number" id="maxAppointmentsPerSlot" th:field="*{maxAppointmentsPerSlot}"/>
                </div>

                <button type="submit" class="btn-submit">Save Settings</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
