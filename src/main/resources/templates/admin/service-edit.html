<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Edit Service - Bella Aura Admin</title>
  <link rel="stylesheet" th:href="@{/css/services.css}">
</head>
<body class="services-body">
<div class="services-wrapper">
  <div class="glass-form-card">
    <h2 style="margin-bottom: 6px;">Edit Salon Service</h2>
    <p style="color: #a0a0b2; margin-bottom: 24px; font-size: 0.9rem;">Update the details for this service.</p>

    <form id="serviceForm" th:action="@{/admin/services/update/{id}(id=${service.id})}" th:object="${service}" method="post">
      <div class="form-group">
        <label for="name">Service Name *</label>
        <input type="text" id="name" th:field="*{name}" required />
      </div>

      <div class="form-group">
        <label for="description">Service Description</label>
        <textarea id="description" th:field="*{description}"></textarea>
      </div>

      <div class="form-group">
        <label for="price">Price (LKR) *</label>
        <input type="number" step="0.01" id="price" th:field="*{price}" required />
      </div>

      <div class="form-group">
        <label for="durationMinutes">Estimated Duration (Minutes) *</label>
        <input type="number" id="durationMinutes" th:field="*{durationMinutes}" required />
      </div>

      <div class="form-actions">
        <a th:href="@{/admin/services}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary">Update Service</button>
      </div>
    </form>
  </div>
</div>

<script th:src="@{/js/services.js}"></script>
</body>
</html>
