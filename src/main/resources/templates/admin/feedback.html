<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Customer Feedback - Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <h2>Customer Feedback List</h2>
    <table>
        <thead>
            <tr>
                <th>Customer Name</th>
                <th>Email</th>
                <th>Rating</th>
                <th>Comment</th>
                <th>Submitted Date</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="item : ${feedbacks}">
                <td th:text="${item.customerName}">Name</td>
                <td th:text="${item.customerEmail}">Email</td>
                <td th:text="${item.rating} + ' / 5'">Rating</td>
                <td th:text="${item.comment}">Comment</td>
                <td th:text="${#temporals.format(item.createdAt, 'yyyy-MM-dd HH:mm')}">Date</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
