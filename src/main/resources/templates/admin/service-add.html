<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Add Service - Bella Aura Admin</title>
  <link rel="stylesheet" th:href="@{/css/services.css}">
</head>
<body class="services-body">
<div class="services-wrapper">
  <div class="glass-form-card">
    <h2 style="margin-bottom: 6px;">Add New Salon Service</h2>
    <p style="color: #a0a0b2; margin-bottom: 24px; font-size: 0.9rem;">Fill in the details below to publish a new service.</p>

    <form id="serviceForm" th:action="@{/admin/services/save}" th:object="${service}" method="post">
      <div class="form-group">
        <label for="name">Service Name *</label>
        <input type="text" id="name" th:field="*{name}" placeholder="e.g., Executive Beard Trim & Facial" required />
      </div>

      <div class="form-group">
        <label for="description">Service Description</label>
        <textarea id="description" th:field="*{description}" placeholder="Describe what is included in this service..."></textarea>
      </div>

      <div class="form-group">
        <label for="price">Price (LKR) *</label>
        <input type="number" step="0.01" id="price" th:field="*{price}" placeholder="e.g., 2500.00" required />
      </div>

      <div class="form-group">
        <label for="durationMinutes">Estimated Duration (Minutes) *</label>
        <input type="number" id="durationMinutes" th:field="*{durationMinutes}" placeholder="e.g., 45" required />
      </div>

      <div class="form-actions">
        <a th:href="@{/admin/services}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary">Save Service</button>
      </div>
    </form>
  </div>
</div>

<script th:src="@{/js/services.js}"></script>
</body>
</html>
