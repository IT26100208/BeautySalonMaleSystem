<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Beauty Salon Management</title>

    <link rel="stylesheet" th:href="@{/css/login-style.css}">
</head>
<body>

<div class="login-container">

    <div class="login-box">

        <h1>Beauty Salon</h1>
        <h2>Management System</h2>

        <div th:if="${param.registered}" class="alert success">
            Registration successful. Please login to continue.
        </div>

        <div th:if="${param.error}" class="alert error">
            Invalid email or password.
        </div>

        <div th:if="${param.logout}" class="alert success">
            You have been logged out successfully.
        </div>

        <form th:action="@{/login}" method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <div class="form-group">
                <label for="email">Email</label>

                <input type="email"
                       id="email"
                       name="email"
                       placeholder="Enter your email"
                       required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Enter your password"
                       required>
            </div>

            <button type="submit" class="btn primary full-width">
                Login
            </button>

            <div class="register-link">
                <p>Don't have an account?</p>

                <a th:href="@{/register}">
                    Create a Customer Account
                </a>
            </div>

        </form>

    </div>

</div>

</body>
</html>
