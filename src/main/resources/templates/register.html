<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Bella Aura</title>

    <!-- Same stylesheet as the login page -->
    <link rel="stylesheet" th:href="@{/css/login-style.css}">
    <link rel="stylesheet" th:href="@{/css/cursor.css}">
</head>
<body>

<div class="login-container">
    <div class="login-box register-box" id="loginBox">

        <div class="brand">
            <div class="brand-icon">&#9986;</div>
            <h1>Bella Aura</h1>
            <h2>Create Customer Account</h2>
        </div>

        <div th:if="${error}" class="alert error">
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/register}" th:object="${user}" method="post" id="registerForm">

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="form-row">
                <!-- First Name -->
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <div class="input-wrap">
                        <input type="text" id="firstName" th:field="*{firstName}"
                               placeholder="First name" required>
                    </div>
                    <p class="validation-error" th:if="${#fields.hasErrors('firstName')}"
                       th:errors="*{firstName}"></p>
                </div>

                <!-- Last Name -->
                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <div class="input-wrap">
                        <input type="text" id="lastName" th:field="*{lastName}"
                               placeholder="Last name" required>
                    </div>
                    <p class="validation-error" th:if="${#fields.hasErrors('lastName')}"
                       th:errors="*{lastName}"></p>
                </div>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email</label>
                <div class="input-wrap">
                    <span class="input-icon">&#9993;</span>
                    <input type="email" id="email" th:field="*{email}"
                           placeholder="example@gmail.com" required>
                </div>
                <p class="validation-error" th:if="${#fields.hasErrors('email')}"
                   th:errors="*{email}"></p>
            </div>

            <!-- Phone Number -->
            <div class="form-group">
                <label for="phoneNumber">Phone Number</label>
                <div class="input-wrap">
                    <span class="input-icon">&#9742;</span>
                    <input type="text" id="phoneNumber" th:field="*{phoneNumber}"
                           placeholder="0771234567" required>
                </div>
                <p class="validation-error" th:if="${#fields.hasErrors('phoneNumber')}"
                   th:errors="*{phoneNumber}"></p>
            </div>

            <!-- Address -->
            <div class="form-group">
                <label for="address">Address</label>
                <div class="input-wrap textarea">
                    <span class="input-icon">&#8962;</span>
                    <textarea id="address" th:field="*{address}"
                              placeholder="Enter your address" rows="3"></textarea>
                </div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrap">
                    <span class="input-icon">&#128274;</span>
                    <input type="password" id="password" th:field="*{password}"
                           placeholder="Create a password" autocomplete="new-password" required>
                    <button type="button" class="toggle-pass" id="togglePass"
                            aria-label="Show password">Show</button>
                </div>
            </div>

            <!-- Register Button -->
            <button type="submit" class="btn primary full-width" id="registerBtn">
                <span class="btn-text" data-loading="Creating account...">Register</span>
                <span class="spinner" aria-hidden="true"></span>
            </button>

            <p class="divider">Already have an account?</p>

            <!-- Back to Login Button -->
            <a th:href="@{/login}" class="btn secondary full-width">
                <span class="arrow">&larr;</span> Back to Login
            </a>

        </form>
    </div>
</div>

<script>
    const box = document.getElementById('loginBox');
    const pass = document.getElementById('password');
    const form = document.getElementById('registerForm');
    const btn = document.getElementById('registerBtn');

    // Cursor-following glow
    box.addEventListener('pointermove', e => {
        const r = box.getBoundingClientRect();
        box.style.setProperty('--mx', (e.clientX - r.left) + 'px');
        box.style.setProperty('--my', (e.clientY - r.top) + 'px');
    });

    // Show / hide password
    document.getElementById('togglePass').addEventListener('click', function () {
        const show = pass.type === 'password';
        pass.type = show ? 'text' : 'password';
        this.textContent = show ? 'Hide' : 'Show';
        this.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    });

    // Loading state on valid submit
    form.addEventListener('submit', () => {
        if (form.checkValidity()) {
            btn.classList.add('loading');
            btn.disabled = true;
        }
    });
</script>
<script th:src="@{/js/cursor.js}"></script>
</body>
</html>
