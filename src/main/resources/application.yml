spring:
  datasource:
    url: jdbc:mysql://localhost:3306/SaloonManagement?useSSL=false&serverTimezone=UTC
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: false # Keep this disabled until your migration scripts are MySQL-compatible